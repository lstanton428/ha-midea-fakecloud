name: Midea Local
version: "0.2.1"
slug: midea_fakecloud
description: Local control for Midea dehumidifiers, plus a stand-in for Midea's cloud so their Wi-Fi stays connected.
url: https://github.com/lstanton428/ha-midea-fakecloud
arch:
  - amd64
  - aarch64
startup: services
boot: auto
# The module only ever connects to port 443. Host networking lets the add-on
# listen on the LAN address alone, leaving 443 on Tailscale's address free.
host_network: true
hassio_api: true
ingress: true
ingress_port: 0
panel_icon: mdi:cloud-sync-outline
panel_title: Midea Local
map:
  - addon_config:rw
services:
  - mqtt:want
options:
  bind_address: auto
  port: 443
  capture_minutes: 0
  upstream: "3.33.221.184:443"
  devices: []
schema:
  bind_address: str
  port: port
  capture_minutes: int(0,30)
  upstream: str
  devices:
    - name: str
      ip: str
      device_id: int
      token: password
      key: password
      port: port?
      protocol: int(1,3)?
      model: str?
      subtype: int?
      type: int?
      area: str?
      entity_id_prefix: str?
      refresh_interval: int(5,600)?
